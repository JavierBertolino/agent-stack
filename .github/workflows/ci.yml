name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Shell syntax
        run: |
          sh -n scripts/setup-agent-stack.sh
          sh -n setup.sh
          sh -n scripts/doctor.sh
          sh -n scripts/upgrade-agent-stack.sh
          sh -n scripts/update-agent-stack.sh
          sh -n scripts/astack
          sh -n scripts/agent-stack
          sh -n install.sh
          sh -n scripts/sync-agent-mirrors.sh
          for t in tests/test-*.sh tests/run.sh; do sh -n "$t"; done
      - name: ShellCheck
        uses: koalaman/shellcheck-py@v0.1.0
        with:
          files: >-
            scripts/setup-agent-stack.sh
            setup.sh
            scripts/doctor.sh
            scripts/upgrade-agent-stack.sh
            scripts/update-agent-stack.sh
            scripts/astack
            scripts/agent-stack
            install.sh
            scripts/sync-agent-mirrors.sh
            tests/run.sh
            tests/test-*.sh
          severity: error
      - name: Python syntax
        run: |
          python3 -m py_compile scripts/run-state.py scripts/validate-contracts.py scripts/build-installer.sh scripts/build-release.sh
      - name: Reproducible standalone build
        run: |
          python3 scripts/build-installer.sh --kit-root "$PWD" --check
      - name: Fixture and installer tests
        run: |
          sh tests/run.sh --kit-root "$PWD"
      - name: Doctor on a fixture install
        run: |
          T=$(mktemp -d)
          trap 'rm -rf "$T"' EXIT
          sh scripts/setup-agent-stack.sh init --root "$T" --kit-root "$PWD" --platforms opencode,claude,codex,cursor --mcp none
          sh scripts/doctor.sh --root "$T" --kit-root "$PWD"
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Public-safety scan
        run: |
          sh scripts/check-public-safety.sh --kit-root "$PWD"
      - name: Release artifact install test
        run: |
          python3 scripts/build-release.sh --kit-root "$PWD" --dist "$RUNNER_TEMP/dist"
          T=$(mktemp -d)
          P=$(mktemp -d)
          trap 'rm -rf "$T" "$P"' EXIT
          ASTACK_RELEASE_BASE="$RUNNER_TEMP/dist" sh "$RUNNER_TEMP/dist/install.sh" --prefix="$P" < /dev/null
          (cd "$T" && PATH="$P/bin:$PATH" astack init --platforms opencode --mcp none)
          (cd "$T" && PATH="$P/bin:$PATH" astack check)
          (cd "$T" && PATH="$P/bin:$PATH" astack doctor)
