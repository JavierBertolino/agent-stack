name: release
# Triggered automatically by version tags (created by tag.yml when VERSION
# changes on main), or manually from the Actions tab with an existing tag.
# Validation runs read-only; only the publish job can write the release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install OpenSpec
        run: |
          npm install -g @fission-ai/openspec@latest
      - name: Tag matches VERSION
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          TAG="${TAG#v}"
          VERSION=$(awk 'NR == 1 { print $1; exit }' VERSION)
          [ "$TAG" = "$VERSION" ] || { echo "tag $TAG does not match VERSION $VERSION" >&2; exit 1; }
      - name: Full test suite
        run: |
          sh tests/run.sh --kit-root "$PWD"
      - name: Reproducible standalone build
        run: |
          python3 scripts/build-installer.sh --kit-root "$PWD" --check
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Public-safety scan
        run: |
          sh scripts/check-public-safety.sh --kit-root "$PWD"
      - name: Build release artifacts
        run: |
          python3 scripts/build-release.sh --kit-root "$PWD" --dist dist
      - name: Validate a clean install from the built archive
        run: |
          T=$(mktemp -d)
          P=$(mktemp -d)
          trap 'rm -rf "$T" "$P"' EXIT
          (cd dist && sha256sum -c astack.tar.gz.sha256)
          ASTACK_RELEASE_BASE="$PWD/dist" sh dist/install.sh --prefix="$P" < /dev/null
          (cd "$T" && PATH="$P/bin:$PATH" astack init --platforms opencode --mcp none)
          (cd "$T" && PATH="$P/bin:$PATH" astack check)
          (cd "$T" && PATH="$P/bin:$PATH" astack doctor)
      - name: Upload verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: astack-dist
          path: dist/
          if-no-files-found: error
  publish:
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: astack-dist
          path: dist
      - name: Verify checksums
        run: |
          (cd dist && sha256sum -c astack.tar.gz.sha256)
          (cd dist && sha256sum -c checksums.txt)
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if gh release view "$TAG" -R ${{ github.repository }} >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh release create "$TAG" -R ${{ github.repository }} \
            --title "Agent Stack $TAG" \
            --notes "See CHANGELOG.md at $TAG for details." \
            dist/astack.tar.gz \
            dist/astack.tar.gz.sha256 \
            dist/checksums.txt \
            "dist/install.sh#install.sh"
