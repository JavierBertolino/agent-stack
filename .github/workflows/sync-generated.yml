name: sync generated installer

on:
  push:
    branches:
      - chore/public-release-prep
    paths:
      - "scripts/setup-agent-stack.sh"
      - "scripts/build-installer.sh"
      - ".agent-stack/**"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/public-release-prep
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate standalone setup.sh
        run: python3 scripts/build-installer.sh --kit-root "$PWD"
      - name: Commit generated installer
        shell: sh
        run: |
          if git diff --quiet -- setup.sh; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add setup.sh
          git commit -m "Regenerate standalone installer"
          git push
